<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>thr34ds</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <!-- Sidebar: thread list -->
    <aside id="sidebar">
      <header class="sidebar-header">
        <h1>thr34ds</h1>
        <button id="new-thread-btn" title="New thread">＋</button>
      </header>

      <div id="new-thread-form" class="hidden">
        <input id="new-thread-title" type="text" placeholder="Thread title…" maxlength="120" />
        <button id="new-thread-submit">Create</button>
        <button id="new-thread-cancel">✕</button>
      </div>

      <ul id="thread-list"></ul>

      <footer class="sidebar-footer">
        <button id="sync-time-btn" title="Sync clock with atomic time servers">⏱ Sync time</button>
        <span id="sync-status"></span>
      </footer>
    </aside>

    <!-- Main area: message view -->
    <main id="main">
      <div id="empty-state">
        <p>Select a thread or create a new one.</p>
      </div>

      <div id="thread-view" class="hidden">
        <header id="thread-header">
          <h2 id="thread-title"></h2>
          <div class="header-actions">
            <button id="issue-summons-btn" class="mini" title="Issue a summons">+ Summons</button>
            <button id="take-cut-btn" class="mini" title="Take a clean cut">⛓ Cut</button>
            <button id="show-cuts-btn" class="mini" title="View cuts & posterity">Cuts</button>
            <button id="delete-thread-btn" title="Delete thread">🗑</button>
          </div>
        </header>

        <section id="documents-panel">
          <div class="panel-head"><span>Documents · post-quantum signed timeline</span></div>
          <ul id="document-list"></ul>
        </section>

        <div id="message-list"></div>

        <form id="message-form">
          <textarea
            id="message-input"
            placeholder="Write a message…"
            rows="3"
            maxlength="4000"
          ></textarea>
          <button type="submit">Send</button>
        </form>
      </div>
    </main>
  </div>

  <script type="module" src="main.js"></script>

  <!-- Always-visible overlay: live clock + thread list -->
  <div id="overlay">
    <div id="overlay-clock"></div>
    <ul id="overlay-thread-list"></ul>
  </div>

  <!-- Cuts & posterity: each cut shows the posterities attached to it -->
  <div id="cuts-modal" class="hidden">
    <div class="cuts-card">
      <div class="panel-head">
        <span>Clean cuts · one person, all threads, in time</span>
        <button id="close-cuts" class="mini">✕</button>
      </div>
      <ul id="cuts-list"></ul>
    </div>
  </div>
</body>
</html>
